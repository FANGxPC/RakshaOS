<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RakshaOS Shield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e5e7eb; }
    .header { background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 16px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 16px; font-weight: 700; color: white; }
    .header .shield { font-size: 24px; }
    .status { padding: 12px 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; }
    .status .dot.off { background: #ef4444; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: #1f2937; }
    .stat { background: #0f1117; padding: 12px; text-align: center; }
    .stat .num { font-size: 20px; font-weight: 700; color: white; }
    .stat .label { font-size: 10px; color: #6b7280; text-transform: uppercase; margin-top: 2px; }
    .history { padding: 12px 16px; }
    .history h3 { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .scan-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1f2937; }
    .scan-item .url { font-size: 12px; color: #9ca3af; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .badge.safe { background: #052e16; color: #22c55e; }
    .badge.warning { background: #431407; color: #f59e0b; }
    .badge.danger { background: #450a0a; color: #ef4444; }
    .empty { text-align: center; padding: 30px; color: #4b5563; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="shield">🛡️</span>
    <h1>RakshaOS Shield</h1>
  </div>
  
  <div class="status">
    <div>
      <span class="dot" id="statusDot"></span>
      <span id="statusText" style="font-size: 13px;">Protection Active</span>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px;">
      <input type="checkbox" id="toggleProtection" checked>
      Enabled
    </label>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="num" id="pagesScanned">0</div>
      <div class="label">Scanned</div>
    </div>
    <div class="stat">
      <div class="num" id="threatsFound" style="color: #ef4444;">0</div>
      <div class="label">Threats</div>
    </div>
    <div class="stat">
      <div class="num" id="safePages" style="color: #22c55e;">0</div>
      <div class="label">Safe</div>
    </div>
  </div>
  
  <div class="history">
    <h3>Recent Scans</h3>
    <div id="historyList">
      <div class="empty">No scans yet. Browse the web and RakshaOS will automatically protect you.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
